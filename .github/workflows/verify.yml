name: Verify Stillnote
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify JavaScript syntax
        run: |
          node --check public/js/app.js
          node --check public/js/store.js
      - name: Run local-first store tests
        run: npm test
      - name: Verify static entrypoints
        run: |
          test -f public/index.html
          test -f public/notes.html
          test -f public/vercel.json
